# .ipa SEM assinatura, para instalar com Apple ID gratuito (SideStore e afins), sem Mac.
# Debug usa o Metro da máquina; Release leva o JS/Hermes embutido, sem launcher/menu de dev.
name: iOS dev build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Configuração do IPA
        type: choice
        options:
          - Debug
          - Release
        default: Debug

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      IPA_NAME: ${{ inputs.configuration == 'Release' && 'hangar-release' || 'hangar-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --workspace=@hangar/core --workspace=mobile
      - working-directory: mobile
        run: npm run i18n:compile:core && npm run i18n:compile
      - working-directory: mobile
        run: npx expo prebuild --platform ios --no-install && (cd ios && pod install)
      - working-directory: mobile/ios
        run: |
          ws=$(ls -d *.xcworkspace | head -1)
          xcodebuild -workspace "$ws" -scheme "${ws%.xcworkspace}" -configuration "$CONFIGURATION" \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R "build/Build/Products/$CONFIGURATION-iphoneos/"*.app Payload/
          if [ "$CONFIGURATION" = Release ]; then
            python3 -I - ../app.json Payload/*.app <<'PY'
          import json
          import os
          import plistlib
          import sys
          import uuid
          from pathlib import Path

          with Path(sys.argv[1]).open() as stream:
              runtime = json.load(stream)["expo"]["runtimeVersion"]
          for app_path in sys.argv[2:]:
              app = Path(app_path)
              bundle = app / "main.jsbundle"
              if not bundle.is_file() or bundle.stat().st_size == 0:
                  raise SystemExit(f"Release sem main.jsbundle válido: {bundle}")
              with bundle.open("rb") as stream:
                  if stream.read(8) != bytes.fromhex("c61fbc03c103191f"):
                      raise SystemExit(f"Release sem bytecode Hermes: {bundle}")
              for name in ("EXDevLauncher.bundle", "EXDevMenu.bundle"):
                  if any(app.rglob(name)):
                      raise SystemExit(f"Recurso de desenvolvimento no Release: {name}")
              with (app / "Expo.plist").open("rb") as stream:
                  updates = plistlib.load(stream)
              expected = {
                  "EXUpdatesEnabled": True,
                  "EXUpdatesURL": "https://u.expo.dev/9fd06001-323e-4b82-835f-6dfc3674236d",
                  "EXUpdatesRequestHeaders": {"expo-channel-name": "preview"},
                  "EXUpdatesRuntimeVersion": runtime,
                  "EXUpdatesCheckOnLaunch": "ALWAYS",
                  "EXUpdatesLaunchWaitMs": 0,
              }
              for key, value in expected.items():
                  if updates.get(key) != value:
                      raise SystemExit(f"Release com OTA inválida: {key} = {updates.get(key)!r}")
              try:
                  manifest = json.loads((app / "EXUpdates.bundle" / "app.manifest").read_text())
                  if not isinstance(manifest, dict) or type(manifest.get("commitTime")) is not int or not isinstance(manifest.get("assets"), list):
                      raise ValueError("commitTime ou assets inválidos")
                  if str(uuid.UUID(manifest["id"])) != manifest["id"].lower():
                      raise ValueError("id inválido")
                  for asset in manifest["assets"]:
                      if not isinstance(asset, dict) or not all(isinstance(asset.get(key), str) for key in ("packagerHash", "type", "nsBundleFilename")):
                          raise ValueError("asset inválido")
              except (OSError, ValueError, KeyError, TypeError, AttributeError) as error:
                  raise SystemExit(f"Release sem app.manifest válido: {error}")
              # A fonte do SideStore declara este mesmo número; diferente, ele recusa o IPA baixado.
              info_path = app / "Info.plist"
              with info_path.open("rb") as stream:
                  info = plistlib.load(stream)
              info["CFBundleVersion"] = os.environ["GITHUB_RUN_NUMBER"]
              with info_path.open("wb") as stream:
                  plistlib.dump(info, stream, fmt=plistlib.FMT_BINARY)
          PY
          fi
          zip -qry "$IPA_NAME.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-ipa
          path: mobile/ios/${{ env.IPA_NAME }}.ipa
          retention-days: 30
          if-no-files-found: error

  # SideStore instala e atualiza o Hangar pela fonte fixa da release mobile-latest.
  publish:
    if: ${{ inputs.configuration == 'Release' }}
    needs: ipa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: mobile-latest
      cancel-in-progress: false
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: hangar-release-ipa
          path: out
      # Daqui até o APK, falha não segura o IPA: a release sai sem APK e o aviso fica no log.
      - if: ${{ env.EXPO_TOKEN != '' }}
        continue-on-error: true
        run: npm ci --workspace=@hangar/core --workspace=mobile
      - name: APK do mesmo runtime
        working-directory: mobile
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::Segredo EXPO_TOKEN ausente; mobile-latest sai sem hangar.apk."
            exit 0
          fi
          runtime=$(node -p 'require("./app.json").expo.runtimeVersion')
          if ! npx --yes eas-cli@23.2.0 build:list --platform android --status finished --build-profile preview \
              --runtime-version "$runtime" --limit 1 --json --non-interactive > ../out/builds.json; then
            # Sem saber se há build deste runtime, o hangar.apk publicado fica como está.
            touch ../out/apk-keep
            echo "::warning::eas build:list falhou; o hangar.apk da mobile-latest não foi atualizado nem removido."
            exit 0
          fi
          if ! url=$(node -p 'require("../out/builds.json")[0]?.artifacts?.buildUrl ?? ""'); then
            touch ../out/apk-keep
            echo "::warning::Resposta do eas build:list ilegível; o hangar.apk da mobile-latest não foi atualizado nem removido."
            exit 0
          fi
          if [ -z "$url" ]; then
            echo "::warning::Nenhum build Android preview pronto com runtime $runtime; mobile-latest sai sem hangar.apk."
            exit 0
          fi
          curl -fsSL "$url" -o ../out/hangar.apk \
            || { rm -f ../out/hangar.apk; echo "::warning::Download do APK falhou; mobile-latest sai sem hangar.apk."; }
      - name: Publica na mobile-latest
        run: |
          mv out/hangar-release.ipa out/hangar.ipa
          node mobile/scripts/sidestore-source.mjs out/hangar.ipa "$GITHUB_RUN_NUMBER" > out/sidestore-source.json
          files=(out/hangar.ipa out/sidestore-source.json)
          test -f out/hangar.apk && files+=(out/hangar.apk)
          # Pré-release fora do "Latest": quem lê a release mais nova continua achando a native-latest.
          gh release view mobile-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create mobile-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
                 --prerelease --latest=false --title "Hangar mobile" \
                 --notes "App do celular para SideStore (iOS) e instalação direta (Android). Reescrita a cada build Release do iOS."
          gh release upload mobile-latest "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          # APK de outro runtime nativo não roda o JS deste build; melhor a release sem APK.
          # Remoção que falha derruba o job: o APK velho seguiria publicado.
          if ! test -f out/hangar.apk && ! test -f out/apk-keep; then
            assets=$(gh release view mobile-latest --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            if grep -qx hangar.apk <<<"$assets"; then
              gh release delete-asset mobile-latest hangar.apk --repo "$GITHUB_REPOSITORY" -y
              echo "::warning::hangar.apk anterior removido da mobile-latest."
            fi
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/mobile-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
