# .ipa SEM assinatura, para instalar com Apple ID gratuito (SideStore e afins), sem Mac.
# Debug usa o Metro da máquina; Release leva o JS/Hermes embutido, sem launcher/menu de dev.
name: iOS dev build

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Configuração do IPA
        type: choice
        options:
          - Debug
          - Release
        default: Debug

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CONFIGURATION: ${{ inputs.configuration }}
      IPA_NAME: ${{ inputs.configuration == 'Release' && 'hangar-release' || 'hangar-dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --workspace=@hangar/core --workspace=mobile
      - working-directory: mobile
        run: npm run i18n:compile:core && npm run i18n:compile
      - working-directory: mobile
        run: npx expo prebuild --platform ios --no-install && (cd ios && pod install)
      - working-directory: mobile/ios
        run: |
          ws=$(ls -d *.xcworkspace | head -1)
          xcodebuild -workspace "$ws" -scheme "${ws%.xcworkspace}" -configuration "$CONFIGURATION" \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -R "build/Build/Products/$CONFIGURATION-iphoneos/"*.app Payload/
          if [ "$CONFIGURATION" = Release ]; then
            python3 -I - Payload/*.app <<'PY'
          import json
          import plistlib
          import sys
          import uuid
          from pathlib import Path

          for app_path in sys.argv[1:]:
              app = Path(app_path)
              bundle = app / "main.jsbundle"
              if not bundle.is_file() or bundle.stat().st_size == 0:
                  raise SystemExit(f"Release sem main.jsbundle válido: {bundle}")
              with bundle.open("rb") as stream:
                  if stream.read(8) != bytes.fromhex("c61fbc03c103191f"):
                      raise SystemExit(f"Release sem bytecode Hermes: {bundle}")
              for name in ("EXDevLauncher.bundle", "EXDevMenu.bundle"):
                  if any(app.rglob(name)):
                      raise SystemExit(f"Recurso de desenvolvimento no Release: {name}")
              with (app / "Expo.plist").open("rb") as stream:
                  updates = plistlib.load(stream)
              with (app / "Info.plist").open("rb") as stream:
                  version = plistlib.load(stream)["CFBundleShortVersionString"]
              expected = {
                  "EXUpdatesEnabled": True,
                  "EXUpdatesURL": "https://u.expo.dev/9fd06001-323e-4b82-835f-6dfc3674236d",
                  "EXUpdatesRequestHeaders": {"expo-channel-name": "preview"},
                  "EXUpdatesRuntimeVersion": version,
                  "EXUpdatesCheckOnLaunch": "ALWAYS",
                  "EXUpdatesLaunchWaitMs": 0,
              }
              for key, value in expected.items():
                  if updates.get(key) != value:
                      raise SystemExit(f"Release com OTA inválida: {key} = {updates.get(key)!r}")
              try:
                  manifest = json.loads((app / "EXUpdates.bundle" / "app.manifest").read_text())
                  if not isinstance(manifest, dict) or type(manifest.get("commitTime")) is not int or not isinstance(manifest.get("assets"), list):
                      raise ValueError("commitTime ou assets inválidos")
                  if str(uuid.UUID(manifest["id"])) != manifest["id"].lower():
                      raise ValueError("id inválido")
                  for asset in manifest["assets"]:
                      if not isinstance(asset, dict) or not all(isinstance(asset.get(key), str) for key in ("packagerHash", "type", "nsBundleFilename")):
                          raise ValueError("asset inválido")
              except (OSError, ValueError, KeyError, TypeError, AttributeError) as error:
                  raise SystemExit(f"Release sem app.manifest válido: {error}")
          PY
          fi
          zip -qry "$IPA_NAME.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-ipa
          path: mobile/ios/${{ env.IPA_NAME }}.ipa
          retention-days: 30
          if-no-files-found: error
