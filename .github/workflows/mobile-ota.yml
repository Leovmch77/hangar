# Publica a atualização OTA do app (canal preview, iOS e Android) quando o código do app entra na main.
# Só JS/assets: mudança nativa exige subir runtimeVersion (native-N) e gerar binário novo antes.
# Precisa do segredo EXPO_TOKEN (token de robô do projeto no expo.dev).
name: Mobile OTA

on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - packages/core/**
      - messages/**
  workflow_dispatch:

concurrency:
  group: mobile-ota
  cancel-in-progress: false

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[skip ota]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Sem EXPO_TOKEN não publica
        if: ${{ env.EXPO_TOKEN == '' }}
        run: echo "::warning::Segredo EXPO_TOKEN ausente; OTA não publicada." && exit 0
      - if: ${{ env.EXPO_TOKEN != '' }}
        uses: actions/checkout@v4
      - if: ${{ env.EXPO_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - if: ${{ env.EXPO_TOKEN != '' }}
        run: npm ci --workspace=@hangar/core --workspace=mobile
      - if: ${{ env.EXPO_TOKEN != '' }}
        working-directory: mobile
        run: npm run i18n:compile:core && npm run i18n:compile
      - if: ${{ env.EXPO_TOKEN != '' }}
        working-directory: mobile
        env:
          MESSAGE: ${{ github.event.head_commit.message || 'manual' }}
        run: |
          npx --yes eas-cli@latest update --channel preview --environment preview --platform all \
            --message "$(printf '%s' "$MESSAGE" | head -1 | cut -c1-80) (${GITHUB_SHA::9})" --non-interactive
      # Os .map do bundle são o que traduz a pilha do "Último erro" (Ajustes > Sobre).
      - if: ${{ env.EXPO_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ota-${{ github.sha }}
          path: mobile/dist
          retention-days: 90
