language: pt-BR
reviews:
  profile: chill
  auto_review:
    auto_pause_after_reviewed_commits: 0
  path_filters:
    - "!**/package-lock.json"
    - "!**/Cargo.lock"
    - "!desktop-native/vendor/gpui-*/**"
    - "!**/tests/**"
    - "!**/test_*.py"
    - "!**/*.test.ts"
    - "!**/*.test.tsx"
    - "!**/*.test.mjs"
    - "!**/fixtures/**"
    - "!**/*fixtures*.json"
    - "!**/golden/**"
    - "!**/paraglide/**"
    - "!**/*.snap"
